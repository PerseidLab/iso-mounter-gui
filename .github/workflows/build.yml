name: Build and Release Binary

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Tkinter)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Compile Standalone Binary
        run: |
          pyinstaller --noconsole --onefile --name iso-mounter-linux-x64 base.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-iso-mounter-linux-x64
          path: dist/iso-mounter-linux-x64

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Generate Auto Version Tag
        id: version
        run: |
          DATE_TAG=$(date +'%Y.%m.%d')
          RUN_NUM=${{ github.run_number }}
          VERSION="v${DATE_TAG}.${RUN_NUM}"
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "iso-mounter-gui ${{ steps.version.outputs.tag }}"
          body: "Automated standalone Linux x64 build compiled via GitHub Actions."
          files: |
            all-artifacts/binary-iso-mounter-linux-x64/iso-mounter-linux-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
